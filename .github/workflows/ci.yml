name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests using bundled data (no model download)
        run: cargo test --workspace --release --locked
      - name: Check external-only configuration
        run: |
          cargo clippy --all-targets --locked --no-default-features -- -D warnings
          cargo test --release --locked --no-default-features
      - name: Fetch the original model (no nagisa installation required)
        run: python tools/download_model.py
      - name: Verify bundled assets against the pinned original
        run: python tools/bundle_model.py --check
      - name: Check pinned Unicode data
        run: python tools/unicode.py --check --references results/unicode
      - name: Test the standalone model and Unicode audit
        env:
          RAGISA_MODEL_DIR: models/nagisa-0.3.0
          RAGISA_UNICODE_REF: results/unicode/singles.tsv
        run: cargo test --release --locked
      - name: Install the Python reference
        run: python -m pip install -r tools/requirements-reference.txt
      - name: Regenerate reference words and POS tags using Python
        run: python tools/reference.py tests/fixtures/ja_parity_subset.jsonl results/reference.jsonl
      - name: Test bundled model against the fresh Python reference
        env:
          RAGISA_FIXTURES: results/reference.jsonl
        run: cargo test --release --locked --test parity --test tagging
      - name: Verify candidate features and pre-tokenized POS references
        run: |
          python tools/pos_reference.py results/pos
          cmp tests/fixtures/pos_candidates.json results/pos/pos_candidates.json
          cmp tests/fixtures/pos_tokens.json results/pos/pos_tokens.json
          cmp tests/fixtures/pos_labels.json results/pos/pos_labels.json
      - name: Verify inference option references
        run: |
          python tools/options_reference.py results/options.json
          cmp tests/fixtures/options.json results/options.json
      - name: Verify nagisa 0.3.0 compatibility fixtures
        run: |
          python tools/compat_reference.py results/compat_030.json
          cmp tests/fixtures/compat_030.json results/compat_030.json
      - name: Verify distributable crates and offline consumer
        run: |
          cargo package --workspace --locked
          python tools/check_package.py
