name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag, manifests and exact model dependency
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python .github/scripts/release.py check --tag "$RELEASE_TAG"

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: [version, checks]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine unpublished versions
        id: plan
        run: python .github/scripts/release.py plan --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Check credentials for first publication
        if: steps.plan.outputs.needs_token == 'true' && env.HAS_TOKEN != 'true'
        run: |
          echo 'First publication requires a crates.io API token in the CARGO_REGISTRY_TOKEN repository secret.'
          exit 1
      - name: Obtain a short-lived crates.io token
        if: steps.plan.outputs.needs_publish == 'true' && env.HAS_TOKEN != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish model first, then ragisa
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: python .github/scripts/release.py publish --tag "$RELEASE_TAG"
