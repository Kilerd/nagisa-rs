name: Rust with build cache
description: Install the tested Rust toolchain and restore job-specific Cargo artifacts.
inputs:
  cache-key:
    description: Build configuration, separated between jobs and feature sets.
    required: true
  components:
    description: Optional additional toolchain components.
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-workspace-crates: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
